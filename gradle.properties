org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Note for ARM64 Linux developers: AGP's bundled AAPT2 is an x86_64 binary, so builds
# fail there until it is pointed at an ARM64-capable one. That is a property of your
# machine, not of this project, so set it in ~/.gradle/gradle.properties:
#
#   android.aapt2FromMavenOverride=/path/to/an/aapt2/that/runs/here
